verbosity = -1
envfile.optional = ".env"

[tasks]
install.shell = """
    #uv sync --all-groups --frozen
    #uv pip install -r requirements.txt
    pre-commit install --install-hooks
"""
lint.shell = """
    echo "\\033[0;34mpre-commit checks\\033[0m"
    SKIP=identity pre-commit run --hook-stage pre-commit --all-files
    echo "\\033[0;34mpre-push checks\\033[0m"
    SKIP=identity pre-commit run --hook-stage pre-push   --all-files
"""
lint-branch.shell = """
    echo "\\033[0;34mpre-commit checks\\033[0m"
    SKIP=identity pre-commit run --hook-stage pre-commit --from-ref $(git merge-base main HEAD) --to-ref HEAD
    echo "\\033[0;34mpre-push checks\\033[0m"
    SKIP=identity pre-commit run --hook-stage pre-push   --from-ref $(git merge-base main HEAD) --to-ref HEAD
"""
clean.shell = """
    dbt clean --no-clean-project-files-only
    rm -rf dist/
    rm -rf logs/
    dbt deps
"""
compile.shell = """
    poe clean
    dbt compile --target prod
"""
compile-v2.shell = """
    # Write the Parquet files...
    dbt compile --write-metadata --write-lineage --no-warn-error --target ${target}
    # ...and the `manifest.json`
    dbt compile --no-warn-error --target ${target}
"""
compile-v2.args = [
    {name = "target", options = ["-t", "--target"], default = "dev"},
]
docs.shell = """
    dbt docs generate
    uvx --from dbt-colibri colibri generate
    open dist/index.html
    dbt docs serve
"""
cte-lineage.shell = """
    find -P target/compiled -name '*.sql' | xargs -n 1 -P 8 lineage
"""
autofix.shell = """
    uvx --python 3.13 dbt-autofix deprecations --all
"""
render.shell = """
    uvx py-wait-until --message "Rendering model..." \
        dbt compile --quiet --inline "{{ ref('${model_name}') }}" --target $target
"""
render.args = [
    {name = "model_name", positional = true, required = true},
    {name = "target", options = ["-t", "--target"], default = "dev"},
]
render-v2.shell = """
    duckdb -noheader -ascii -c \
        "select relation_name from 'target/metadata/parse/nodes/*.parquet' where name = '${model_name}'"
"""
render-v2.args = [
    {name = "model_name", positional = true, required = true},
]
info.shell = """
    duckdb -box -c "unpivot (select * exclude (payload, description) from 'target/metadata/parse/nodes/*.parquet' where "name" = '${node_name}') on columns(*)::text into name key values value"
"""
info.args = [
    {name = "node_name", positional = true, required = true},
]
document-model.shell = """
    uvx dbt-osmosis yaml document ${model_name} --target prod
"""
document-model.args = [
    {name = "model_name", positional = true, required = true},
]
test-model.shell = """
    dbt test --target prod --indirect-selection cautious --select "resource_type:test,${model_name}"
"""
test-model.args = [
    {name = "model_name", positional = true, required = true},
]
dump-prod-state.shell = """
    if [[ "$(git branch --show-current)" = "main" ]]; then
        echo "error: must be on a feature branch"
        exit 1
    fi
    if [[ ! $allow_dirty && "$(git status --short)" != "" ]]; then
        echo "error: branch is dirty"
        exit 1
    fi

    rm -rf $DBT_PROJECT_DIR/prod-artefacts/
    rm -rf target/

    git checkout $(git merge-base main HEAD) --quiet
    uvx py-wait-until --message "Building production artefacts..." \
        dbt parse --quiet --target prod --target-path prod-artefacts
    echo '*' > $DBT_PROJECT_DIR/prod-artefacts/.gitignore
    if [[ ! ${quiet} ]]; then
        echo 'Production artefacts built!'
    fi

    git switch - --quiet
    uvx py-wait-until --message "Building feature branch artefacts..." \
        dbt parse --quiet
    if [[ ! ${quiet} ]]; then
        echo 'Feature branch artefacts built!'
    fi
"""
dump-prod-state.args = [
    {name = "allow_dirty", options = ["--allow-dirty"], type = "boolean", default = false},
    {name = "quiet", type = "boolean", default = false},
]
slim-ci.shell = """
    echo "\\033[0;34mpoe clean\\033[0m"
    poe clean || exit 1
    echo "\\033[0;34mpoe dump-prod-state\\033[0m"
    poe dump-prod-state || exit 1
    echo "\\033[0;34mdbt list (modified only)\\033[0m"
    dbt list --resource-type model --select 'state:modified' --defer --state prod-artefacts/
    echo "\\033[0;34mdbt build (modified + downstream)\\033[0m"
    dbt build --select 'state:modified+' --defer --state prod-artefacts/
"""
